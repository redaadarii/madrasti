name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 25, Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Tests et packaging
        run: mvn -B verify

  frontend:
    name: Web, mobile et paquet partagé (Turborepo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typage, lint et tests de tous les paquets
        run: npx turbo run typecheck lint test:run
      - name: Build du web
        run: npx turbo run build --filter=@madrasti/web

  e2e:
    name: Bout en bout (stack Docker de production)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      MADRASTI_DB_PASSWORD: ci-password
      MADRASTI_JWT_SECRET: ci-only-secret-at-least-32-bytes-long-0123456789
      MADRASTI_PUBLIC_URL: http://localhost:8081
      MADRASTI_SEED: 'true'
      MADRASTI_BACKEND_REPLICAS: '2'
      # Toutes les connexions des tests viennent de la même IP.
      MADRASTI_LOGIN_PER_MINUTE: '100'
    steps:
      - uses: actions/checkout@v4
      - name: Démarrer la stack
        run: docker compose -f docker-compose.prod.yml up -d --build --wait --wait-timeout 300
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Installer Playwright
        run: npm ci && npx playwright install --with-deps chromium
      - name: Tests Playwright
        working-directory: apps/web
        env:
          E2E_BASE_URL: http://localhost:8081
        run: npm run e2e
      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
      - name: Journaux des conteneurs
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --tail=200
